name: Extract Mesh Triangles Data

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction Script
        run: python extract.py

      - name: Upload Extracted Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-SubMeshTrianglesNew
          path: extracted_triangles.txt
